steps:
- name: gcr.io/google.com/cloudsdktool/cloud-sdk
  id: validate-secrets
  entrypoint: bash
  args:
  - -c
  - |
    set -euo pipefail
    fail=0
    for secret in mediafox-jwt-secret mediafox-token-key foxauth-jwt-secret; do
      if gcloud secrets describe "$$secret" --project="$PROJECT_ID" &>/dev/null; then
        echo "  OK  $$secret"
      else
        echo "  MISSING  $$secret — create with: gcloud secrets create $$secret --project=$PROJECT_ID" >&2
        fail=1
      fi
    done
    exit $$fail

- name: gcr.io/cloud-builders/docker
  args: [build, -t, 'europe-west2-docker.pkg.dev/$PROJECT_ID/fox-suite/mediafox', .]

- name: gcr.io/cloud-builders/docker
  args: [push, 'europe-west2-docker.pkg.dev/$PROJECT_ID/fox-suite/mediafox']

- name: gcr.io/google.com/cloudsdktool/cloud-sdk
  entrypoint: gcloud
  args:
  - run
  - deploy
  - mediafox
  - --image=europe-west2-docker.pkg.dev/$PROJECT_ID/fox-suite/mediafox
  - --region=europe-west2
  - --platform=managed
  - --port=5004
  - --update-env-vars=GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID},NODE_ENV=production,AUTH_ENABLED=true,AUTH_ADMIN_EMAILS=philjfoxton@googlemail.com,DATABASE_PATH=/opt/data/mediafox.db,MEDIA_STORAGE_PATH=/opt/data/media,CORS_ALLOWED_ORIGINS=https://mediafox-843941617497.europe-west2.run.app
  - --set-secrets=AUTH_JWT_SECRET=mediafox-jwt-secret:latest,TOKEN_ENCRYPTION_KEY=mediafox-token-key:latest,FOXAUTH_JWT_SECRET=foxauth-jwt-secret:latest

# Required secrets in GCP Secret Manager (create once):
#   gcloud secrets create mediafox-jwt-secret --project=PROJECT_ID
#   gcloud secrets versions add mediafox-jwt-secret --data-file=- <<< "$(openssl rand -hex 32)"

substitutions:
  _GOOGLE_CLIENT_ID: 843941617497-k5aaruuev5s85ef4qa2oo71v2ckvq6ip.apps.googleusercontent.com

options:
  logging: CLOUD_LOGGING_ONLY
